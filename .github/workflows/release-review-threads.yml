name: Release review threads

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Release pull request number to refresh
        required: true
        type: number
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-release-review-threads:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'release') || contains(github.event.pull_request.labels.*.name, 'release-pr')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check release pull request review threads
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/check-release-review-threads.mjs --github --require-release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refresh release pull request review threads
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/check-release-review-threads.mjs --github --require-release --pr "${{ inputs.pull_request_number }}"
        env:
          GH_TOKEN: ${{ github.token }}
